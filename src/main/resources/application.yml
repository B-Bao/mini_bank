spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minibank}
    username: ${DB_USERNAME:minibank}
    password: ${DB_PASSWORD:minibank}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true

  security:
    user:
      name: ${ACTUATOR_ADMIN_USER:admin}
      password: ${ACTUATOR_ADMIN_PASSWORD:change_me_in_env}
      roles: ACTUATOR_ADMIN
