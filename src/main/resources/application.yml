spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minibank}
    username: ${DB_USERNAME:minibank}
    password: ${DB_PASSWORD:minibank}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-on-start: true
    clean-disable: false
    baseline-on-migrate: true
  security:
    user:
      name: ${ACTUATOR_ADMIN_USER:admin}
      password: ${ACTUATOR_ADMIN_PASSWORD:change_me_in_env}
      roles: ACTUATOR_ADMIN
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForLocalDevOnlyMin32BytesLong}
  expiration: 900000
  refresh-expiration: 604800000