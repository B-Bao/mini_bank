name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: minibank
          POSTGRES_USER: minibank
          POSTGRES_PASSWORD: minibank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Step 1 - Check Code Format with Spotless
        run: ./mvnw spotless:check

      - name: Step 2 - Run Maven Verify (Compile, Flyway & Tests)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: minibank
          DB_USERNAME: minibank
          DB_PASSWORD: minibank
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ACTUATOR_ADMIN_USER: actuatorAdmin
          ACTUATOR_ADMIN_PASSWORD: SuperSecurePassword2026
        run: ./mvnw verify -B