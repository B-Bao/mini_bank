services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # 1. Ép hệ điều hành Container chạy múi giờ Việt Nam
      TZ: Asia/Ho_Chi_Minh
      # 2. Đồng bộ cấu hình múi giờ mặc định của PostgreSQL
      PGTZ: Asia/Ho_Chi_Minh
    volumes: [pgdata:/var/lib/postgresql/data]
    # 3. Lệnh cài đặt gói múi giờ (tzdata) trước khi khởi chạy Postgres trên môi trường Alpine
    entrypoint: >
      sh -c "apk add --no-cache tzdata && exec docker-entrypoint.sh postgres"

  redis:
    image: redis:7-alpine
    environment:
      - TZ=Asia/Ho_Chi_Minh # Đồng bộ múi giờ Việt Nam cho Redis nếu cần dùng cache theo thời gian
    ports: ["6379:6379"]

volumes:
  pgdata:
